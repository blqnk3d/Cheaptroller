<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cheaptroller</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-link active" data-page="home">Home</a>
    <a href="/settings" class="nav-link" data-page="settings">Settings</a>
  </nav>

  <main class="container" id="home-page">
    <h1>Cheaptroller</h1>

    <section class="card">
      <h2>Available IPs</h2>
      <div id="ip-list" class="chips"></div>
    </section>

    <section class="card">
      <h2>Connect via QR Code</h2>
      <canvas id="qr-code"></canvas>
    </section>

    <section class="card">
      <h2>Server Control</h2>
      <button id="shutdown-btn">Shutdown Server</button>
    </section>
  </main>

  <main class="container hidden" id="settings-page">
    <h1>Settings</h1>

    <section class="card">
      <h2>Server Configuration</h2>
      <form id="settings-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="webPort">Web Server Port</label>
            <input type="number" id="webPort" name="webPort" min="1" max="65535">
            <small>Web interface port</small>
          </div>

          <div class="form-group">
            <label for="udpPort">UDP Server Port</label>
            <input type="number" id="udpPort" name="udpPort" min="1" max="65535">
            <small>App communication</small>
          </div>

          <div class="form-group full-width">
            <label for="bonjourName">mDNS Service Name</label>
            <input type="text" id="bonjourName" name="bonjourName">
            <small>Network discovery name</small>
          </div>

          <div class="form-group">
            <label for="stickDeadzone">Stick Deadzone</label>
            <input type="number" id="stickDeadzone" name="stickDeadzone" min="0" max="1" step="0.01">
            <small>Controller deadzone (0-1)</small>
          </div>

          <div class="form-group">
            <label for="clientTimeoutMs">Client Timeout</label>
            <input type="number" id="clientTimeoutMs" name="clientTimeoutMs" min="1000" step="1000">
            <small>Inactive disconnect (ms)</small>
          </div>

          <div class="form-group">
            <label for="latencyStatsMaxSize">Latency Stats Size</label>
            <input type="number" id="latencyStatsMaxSize" name="latencyStatsMaxSize" min="1" max="100">
            <small>Sample count</small>
          </div>
        </div>

        <div class="form-section">
          <h3>Options</h3>
          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" id="openBrowser" name="openBrowser">
              <span>Open browser on startup</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="debugProtocol" name="debugProtocol">
              <span>Enable protocol debug logging</span>
            </label>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Save Settings</button>
          <button type="button" id="reset-btn" class="btn-secondary">Reset to Defaults</button>
        </div>
      </form>
      <div id="settings-message" class="message"></div>
    </section>

    <section class="card">
      <h2>Config File Location</h2>
      <code id="config-path"></code>
    </section>
  </main>

  <!-- QRCode library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
</body>
</html>
