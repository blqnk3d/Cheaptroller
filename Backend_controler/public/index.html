<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Controller Dashboard</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #1e1e1e;
        color: #eee;
        margin: 0;
        padding: 2rem;
    }
    h1, h2 { color: #0ff; margin-bottom: 1rem; }
    .container { display: flex; gap: 2rem; flex-wrap: wrap; }
    .panel {
        background: #2a2a2a;
        border-radius: 10px;
        padding: 1rem;
        flex: 1;
        min-width: 300px;
    }
    label { display: block; margin: 0.5rem 0 0.2rem; }
    input[type=number], input[type=range] { width: 100%; }
    input[type=range] { -webkit-appearance: none; height: 8px; border-radius: 5px; background: #444; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #0ff; cursor: pointer; }
    button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 5px;
        background: #0ff;
        color: #111;
        cursor: pointer;
        font-weight: bold;
    }
    button:hover { background: #0aa; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    #status { background: #111; color: #0f0; padding: 1rem; border-radius: 5px; height: 200px; overflow-y: auto; font-family: monospace; }
    .axis-visual {
        width: 100px;
        height: 100px;
        border: 2px solid #0ff;
        border-radius: 50%;
        position: relative;
        margin-top: 0.5rem;
    }
    .stick-dot {
        width: 12px;
        height: 12px;
        background: #0ff;
        border-radius: 50%;
        position: absolute;
        top: 44px;
        left: 44px;
        transform: translate(0,0);
        transition: transform 0.05s linear;
    }
    .keys { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .key {
        width: 40px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #333;
        border-radius: 5px;
        font-weight: bold;
        color: #888;
        transition: background 0.1s, color 0.1s;
    }
    .key.active { background: #0ff; color: #111; }
    .mouse-pos { margin-top: 0.5rem; }
    .slider-value { float: right; font-weight: bold; color: #0ff; }
    #myip { margin-bottom: 1rem; font-weight: bold; font-size: 1.1rem; color: #0f0; }
</style>
</head>
<body>

<h1>🎮 Controller Dashboard</h1>
<div id="myip">Fetching IP...</div>

<div class="container">
    <div class="panel">
        <h2>Config</h2>
        <form id="configForm">
            <label>
                <input type="checkbox" id="frontendToggle">
                Allow Frontend Config
            </label>

            <label>MAX_SPEED: <span id="MAX_SPEED_val" class="slider-value">80</span></label>
            <input name="MAX_SPEED" type="range" min="10" max="200" step="1">

            <label>DEADZONE: <span id="DEADZONE_val" class="slider-value">0.05</span></label>
            <input name="DEADZONE" type="range" min="0" max="0.3" step="0.005">

            <label>SMOOTH_TIME: <span id="SMOOTH_TIME_val" class="slider-value">0.06</span></label>
            <input name="SMOOTH_TIME" type="range" min="0" max="0.2" step="0.005">

            <button type="submit">Apply</button>
        </form>
    </div>

    <div class="panel">
        <h2>Status</h2>
        <div>
            <strong>Left Stick</strong>
            <div class="axis-visual" id="leftStick">
                <div class="stick-dot" id="leftDot"></div>
            </div>
        </div>
        <div>
            <strong>Right Stick (Mouse)</strong>
            <div class="axis-visual" id="rightStick">
                <div class="stick-dot" id="rightDot"></div>
            </div>
        </div>
        <div class="mouse-pos">
            <strong>Mouse:</strong> <span id="mousePos">0,0</span>
        </div>
        <div>
            <strong>Pressed Keys:</strong>
            <div class="keys" id="keysContainer">
                <div class="key" data-key="w">W</div>
                <div class="key" data-key="a">A</div>
                <div class="key" data-key="s">S</div>
                <div class="key" data-key="d">D</div>
            </div>
        </div>
        <pre id="status"></pre>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const statusEl = document.getElementById('status');
const form = document.getElementById('configForm');

const leftDot = document.getElementById('leftDot');
const rightDot = document.getElementById('rightDot');
const mousePosEl = document.getElementById('mousePos');
const keysContainer = document.getElementById('keysContainer');
const frontendToggle = document.getElementById('frontendToggle');
const myipEl = document.getElementById('myip');

// Slider value spans
const MAX_SPEED_val = document.getElementById('MAX_SPEED_val');
const DEADZONE_val = document.getElementById('DEADZONE_val');
const SMOOTH_TIME_val = document.getElementById('SMOOTH_TIME_val');
const MAX_SPEED_input = form.MAX_SPEED;
const DEADZONE_input = form.DEADZONE;
const SMOOTH_TIME_input = form.SMOOTH_TIME;

// Update slider spans & gradient
function updateSlider(slider, span) {
    const val = parseFloat(slider.value);
    span.textContent = val.toFixed(slider.step < 1 ? 3 : 0);
    const pct = ((val - slider.min) / (slider.max - slider.min)) * 100;
    slider.style.background = `linear-gradient(to right, #0ff ${pct}%, #444 ${pct}%)`;
}
[MAX_SPEED_input, DEADZONE_input, SMOOTH_TIME_input].forEach((slider, i) => {
    const span = [MAX_SPEED_val, DEADZONE_val, SMOOTH_TIME_val][i];
    slider.addEventListener('input', () => updateSlider(slider, span));
    updateSlider(slider, span);
});

// Enable/disable sliders and apply button
function updateFormState(enabled) {
    [...form.elements].forEach(el => {
        if (el.tagName !== 'INPUT' || el.type !== 'checkbox') el.disabled = !enabled;
    });
}

// Fetch initial status and frontend config
fetch('/api/status')
    .then(res => res.json())
    .then(data => {
        frontendToggle.checked = data.allowFrontendConfig;
        updateFormState(data.allowFrontendConfig);
    });

// Fetch server IP(s)
fetch('/api/myip')
    .then(res => res.json())
    .then(data => {
        myipEl.textContent = `Connect your phone to: ${data.ips[0]}:${data.port}`;
    });

// Handle toggle change
frontendToggle.addEventListener('change', () => {
    const allow = frontendToggle.checked;
    fetch('/api/toggleFrontendConfig', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({allow})
    }).then(res => res.json()).then(data => {
        updateFormState(data.allowFrontendConfig);
    });
});

// Socket.IO updates
socket.on('status', data => {
    statusEl.textContent = JSON.stringify(data, null, 2);
    leftDot.style.transform = `translate(${data.leftAxes.x*40}px, ${data.leftAxes.y*40}px)`;
    rightDot.style.transform = `translate(${data.rightAxes.x*40}px, ${data.rightAxes.y*40}px)`;
    mousePosEl.textContent = `${data.mousePos.x}, ${data.mousePos.y}`;
    keysContainer.querySelectorAll('.key').forEach(k => {
        if(data.pressedKeys.includes(k.dataset.key)) k.classList.add('active');
        else k.classList.remove('active');
    });
});

// Apply config
form.addEventListener('submit', e => {
    e.preventDefault();
    const config = Object.fromEntries(new FormData(form));
    for (let k in config) config[k] = parseFloat(config[k]);
    socket.emit('config', config);
});
</script>
</body>
</html>
