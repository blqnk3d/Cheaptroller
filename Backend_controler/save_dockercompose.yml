# docker-compose.yml

services:
  controller-server:
    # Build the service using the local Dockerfile
    build: .
    
    # Give the container privileged capabilities for hardware interaction (important for RobotJS/X11)
    privileged: true

    # The container needs to access the host's graphical environment (X server).
    # Using 'host' network mode simplifies X11 forwarding and port mapping.
    network_mode: "host"

    # CRITICAL: Environment variables and volumes for X11 forwarding
    environment:
      # Tell the container which display server to connect to (the host's)
      - DISPLAY=${DISPLAY}
      # Required for some X11 applications, especially on Linux/WSL
      - QT_X11_NO_MITSHM=1

    volumes:
      # Mount the X11 socket file so the container can communicate with the X server
      - /tmp/.X11-unix:/tmp/.X11-unix
      # OPTIONAL: Uncomment and adjust if your host uses Xauthority for access control
      # - $HOME/.Xauthority:/root/.Xauthority:ro

    # === FIX: Use npm rebuild to resolve NODE_MODULE_VERSION mismatch errors ===
    # This forces native modules (like robotjs) to compile against the exact
    # Node.js version in the running container before the app starts.
    command: /bin/sh -c "npm rebuild robotjs --build-from-source && node index.js"
    
    # Restart policy: always try to restart unless explicitly stopped
    restart: unless-stopped